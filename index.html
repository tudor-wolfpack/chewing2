<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>10Chew &mdash; testul de dinaintea aplicației | Wolfpack Digital</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    /* Wolfpack brand */
    --sunset:#FA357B;
    --midnight:#6561FF;
    --full-moon:#FFCF35;
    --borealis:#00CFB6;

    --ground:#FFFFFF;
    --surface:#FAFAFB;
    --ink:#000000;
    --ink-2:#2B2F36;
    --muted:#5D6470;
    --line:#E4E6EB;
    --line-2:#F0F1F4;
    --borealis-ink:#00786A;
    --midnight-ink:#4B46F5;
    --tint-sunset:#FFF0F5;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 34px -20px rgba(0,0,0,.25);

    --sans:"Satoshi","Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0B0C0E; --surface:#141519; --ink:#F2F3F5; --ink-2:#CBD0D8; --muted:#949BA6;
      --line:#24262C; --line-2:#17191E;
      --borealis-ink:#00CFB6; --midnight-ink:#8E8BFF; --tint-sunset:#1E0D15;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 36px -22px #000;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0B0C0E; --surface:#141519; --ink:#F2F3F5; --ink-2:#CBD0D8; --muted:#949BA6;
    --line:#24262C; --line-2:#17191E;
    --borealis-ink:#00CFB6; --midnight-ink:#8E8BFF; --tint-sunset:#1E0D15;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 36px -22px #000;
    color-scheme:dark;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  img{ max-width:100%; }
  [hidden]{ display:none !important; }

  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    font-size:17px;
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:52rem; margin:0 auto; padding-inline:24px; }
  @media (max-width:520px){ .wrap{ padding-inline:18px; } }

  .logo{ width:190px; height:auto; display:block; }
  .logo.on-dark{ display:none; }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .logo.on-light{ display:none; }
    :root:not([data-theme="light"]) .logo.on-dark{ display:block; }
  }
  :root[data-theme="dark"] .logo.on-light{ display:none; }
  :root[data-theme="dark"] .logo.on-dark{ display:block; }

  /* ---------------- gate ---------------- */
  .gate{ min-height:88vh; display:flex; align-items:center; justify-content:center; }
  .gate-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-top:3px solid var(--sunset);
    border-radius:3px;
    box-shadow:var(--shadow);
    padding:34px 34px 28px;
    width:100%; max-width:25.5rem;
    display:flex; flex-direction:column; gap:18px; align-items:flex-start;
  }
  @media (max-width:420px){ .gate-card{ padding:26px 20px 22px; } }
  .gate-card h1{
    font-size:1.42rem; font-weight:800; letter-spacing:-.015em;
    line-height:1.15; margin:0; text-wrap:balance;
  }
  .gate-card .sub{ margin:0; color:var(--muted); font-size:.95rem; }
  .gate-form{ display:flex; flex-direction:column; gap:10px; width:100%; }
  label.fl{
    font-family:var(--mono); font-size:.67rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted);
  }
  input[type=password]{
    font-family:var(--mono); font-size:1rem; padding:11px 12px;
    border:1px solid var(--line); border-radius:2px;
    background:var(--ground); color:var(--ink); width:100%;
  }
  input[type=password]:focus-visible{ outline:2px solid var(--sunset); outline-offset:1px; border-color:var(--sunset); }
  button.go{
    font-family:inherit; font-size:.95rem; font-weight:700;
    padding:11px 18px; border:0; border-radius:2px;
    background:var(--sunset); color:#000; cursor:pointer; align-self:flex-start;
  }
  button.go:hover{ filter:brightness(1.06); }
  button.go:disabled{ opacity:.55; cursor:progress; }
  button.go:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .err{ color:var(--sunset); font-size:.9rem; margin:0; min-height:1.3em; font-weight:600; }
  .gate-note{
    font-size:.79rem; color:var(--muted); margin:0;
    border-top:1px solid var(--line); padding-top:14px; width:100%;
  }

  /* ---------------- document ---------------- */
  .doc-brand{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding-block:34px 0;
  }
  .emblem{ width:58px; height:58px; flex:0 0 auto; }
  @media (max-width:520px){ .emblem{ display:none; } }

  .doc{ padding-block:30px 96px; }

  .eyebrow{
    font-family:var(--mono); font-size:.68rem; letter-spacing:.13em;
    text-transform:uppercase; color:var(--muted);
    margin:0 0 .55rem; padding-top:11px; position:relative;
  }
  .eyebrow::before{
    content:""; position:absolute; top:0; left:0;
    width:26px; height:3px; background:var(--sunset);
  }
  .doc-head{ border-bottom:1px solid var(--line); padding-bottom:30px; }
  .doc-head .eyebrow{ color:var(--muted); }
  .doc-head h1{
    font-size:clamp(2.1rem,5.6vw,3rem); font-weight:800;
    letter-spacing:-.028em; line-height:1.04;
    margin:0 0 .55rem; text-wrap:balance;
  }
  .doc-head h1 .thin{ color:var(--sunset); }
  .lede{ font-size:1.09rem; color:var(--ink-2); max-width:42rem; margin:0 0 26px; }
  dl.meta{ display:grid; grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr)); gap:16px 24px; margin:0; }
  dl.meta dt{
    font-family:var(--mono); font-size:.65rem; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); margin-bottom:2px;
  }
  dl.meta dd{ margin:0; font-size:.94rem; font-weight:500; }

  .doc section{ padding-block:44px; border-bottom:1px solid var(--line-2); }
  .doc section:last-of-type{ border-bottom:0; }
  .doc h2{
    font-size:clamp(1.5rem,3.4vw,1.95rem); font-weight:700;
    letter-spacing:-.021em; line-height:1.16; margin:0 0 18px; text-wrap:balance;
  }
  .doc h3{ font-size:1rem; font-weight:700; margin:26px 0 8px; }
  .doc p{ margin:0 0 14px; max-width:40rem; }
  .doc strong{ font-weight:700; }

  .split{ display:grid; grid-template-columns:1fr 1fr; gap:30px 38px; margin-top:8px; }
  @media (max-width:720px){ .split{ grid-template-columns:1fr; gap:26px; } }
  .col > h3:first-child{ margin-top:0; }
  h3.yes, h3.no{
    font-family:var(--mono); font-weight:500; font-size:.71rem;
    letter-spacing:.12em; text-transform:uppercase;
    padding-bottom:7px; border-bottom:2px solid currentColor;
  }
  h3.yes{ color:var(--borealis-ink); }
  h3.no{ color:var(--midnight-ink); }
  .col p{ max-width:none; font-size:.97rem; }

  .hyp{
    background:var(--tint-sunset); border-left:3px solid var(--sunset);
    padding:13px 15px; font-size:.94rem !important;
  }

  ul.ticks, ul.crosses{ margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:11px; }
  ul.ticks li, ul.crosses li{ font-size:.95rem; padding-left:1.45em; position:relative; }
  ul.ticks li::before{ content:"+"; position:absolute; left:0; top:0; color:var(--borealis-ink); font-family:var(--mono); font-weight:500; }
  ul.crosses li::before{ content:"\2013"; position:absolute; left:0; top:0; color:var(--midnight-ink); font-family:var(--mono); font-weight:500; }

  .callout{
    margin-top:32px; background:var(--surface);
    border:1px solid var(--line); border-left:3px solid var(--full-moon);
    border-radius:2px; padding:22px 24px 18px;
  }
  .callout h3{ margin-top:0; }
  .callout p{ font-size:.96rem; }
  .callout p:last-child{ margin-bottom:0; }
  .caveat{ color:var(--muted); font-size:.9rem !important; }

  dl.params{ margin:0; display:flex; flex-direction:column; }
  dl.params > div{
    display:grid; grid-template-columns:9.5rem 1fr; gap:6px 22px;
    padding:15px 0; border-top:1px solid var(--line-2); align-items:start;
  }
  dl.params > div:first-child{ border-top:1px solid var(--line); }
  dl.params > div:last-child{ border-bottom:1px solid var(--line); }
  @media (max-width:600px){ dl.params > div{ grid-template-columns:1fr; } }
  dl.params dt{
    font-family:var(--mono); font-size:.69rem; letter-spacing:.11em;
    text-transform:uppercase; color:var(--ink); padding-top:4px;
  }
  dl.params dd{ margin:0; font-size:.96rem; }

  .scale{ margin:24px 0 26px; border:1px solid var(--line); border-radius:2px; padding:18px 20px; background:var(--surface); }
  .scale-label{
    font-family:var(--mono); font-size:.67rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted); margin:0 0 12px !important;
  }
  ol.criteria{ margin:0 0 16px; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:7px; counter-reset:crit; }
  ol.criteria li{
    counter-increment:crit; font-size:.88rem; padding:4px 11px 4px 8px;
    border:1px solid var(--line); border-radius:2px; background:var(--ground);
    display:flex; align-items:baseline; gap:6px;
  }
  ol.criteria li::before{ content:counter(crit); font-family:var(--mono); font-size:.67rem; color:var(--sunset); }
  .scale-strip{ display:flex; gap:4px; }
  .scale-strip span{
    font-family:var(--mono); font-size:.74rem; width:2rem; height:1.75rem;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:2px; color:var(--muted); background:var(--ground);
  }
  .scale-strip span:first-child{ color:var(--sunset); border-color:var(--sunset); }
  .scale-strip span:last-child{ color:var(--borealis-ink); border-color:var(--borealis); }

  .table-scroll{ overflow-x:auto; margin:6px 0 4px; }
  table.crit{ width:100%; border-collapse:collapse; font-size:.93rem; min-width:30rem; }
  table.crit th{
    text-align:left; font-family:var(--mono); font-weight:500;
    font-size:.66rem; letter-spacing:.11em; text-transform:uppercase;
    color:var(--muted); padding:0 14px 9px 0; border-bottom:1px solid var(--ink);
  }
  table.crit td{ padding:12px 14px 12px 0; border-bottom:1px solid var(--line-2); vertical-align:top; }
  table.crit td.num{
    font-family:var(--mono); font-variant-numeric:tabular-nums;
    color:var(--borealis-ink); white-space:nowrap; font-weight:500;
  }
  table.crit tbody tr:nth-child(2) td{ font-weight:700; }

  ul.rules{ margin:10px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:14px; }
  ul.rules li{ font-size:.96rem; }
  .tag{
    font-family:var(--mono); font-size:.63rem; letter-spacing:.1em; text-transform:uppercase;
    font-weight:500; padding:3px 8px; border-radius:2px; margin-right:9px;
    white-space:nowrap; display:inline-block; color:#000;
  }
  .tag.go{ background:var(--borealis); }
  .tag.rework{ background:var(--full-moon); }
  .tag.stop{ background:var(--sunset); }

  ol.open{ margin:14px 0 0; padding-left:1.5em; display:flex; flex-direction:column; gap:9px; }
  ol.open li{ font-size:.96rem; }
  ol.open li::marker{ font-family:var(--mono); font-size:.82rem; color:var(--sunset); }

  .doc-foot{ margin-top:52px; padding-top:22px; border-top:3px solid var(--sunset); display:flex; flex-direction:column; gap:8px; }
  .doc-foot p{ margin:0; font-size:.84rem; color:var(--muted); max-width:none; }
  .doc-foot .conf{ font-family:var(--mono); font-size:.72rem; line-height:1.55; }

  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }
  @media print{
    .gate{ display:none; }
    body{ background:#fff; color:#000; font-size:11pt; }
    .doc{ padding-block:0 0; }
    .doc section{ break-inside:avoid; }
  }
</style>
</head>

<script>
(function(){
  var blob = JSON.parse(document.getElementById('payload').textContent);
  var form = document.getElementById('form');
  var pwEl = document.getElementById('pw');
  var btn  = document.getElementById('btn');
  var err  = document.getElementById('err');
  var gate = document.getElementById('gate');
  var doc  = document.getElementById('doc');
  var brand= document.getElementById('brand');

  function b64(s){
    var raw = atob(s), out = new Uint8Array(raw.length);
    for (var i=0;i<raw.length;i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var pw = pwEl.value;
    if (!pw) return;
    if (!(window.crypto && window.crypto.subtle)){
      err.textContent = 'Browserul nu suportă decriptarea. Deschideți pagina în Chrome, Safari sau Firefox actualizat.';
      return;
    }
    if (location.protocol === 'file:' && !window.isSecureContext){
      err.textContent = 'Deschideți fișierul dintr-un browser modern; unele browsere blochează decriptarea pe file://.';
    }
    err.textContent = '';
    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = 'Se decriptează...';

    crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey(
          { name:'PBKDF2', salt:b64(blob.kdf.salt), iterations:blob.kdf.iter, hash:blob.kdf.hash },
          base, { name:'AES-GCM', length:256 }, false, ['decrypt']
        );
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(blob.iv) }, key, b64(blob.ct));
      })
      .then(function(plain){
        doc.innerHTML = new TextDecoder().decode(plain);
        Array.prototype.forEach.call(doc.querySelectorAll('table'), function(t){
          if (t.parentNode.classList.contains('table-scroll')) return;
          var d = document.createElement('div');
          d.className = 'table-scroll';
          t.parentNode.insertBefore(d, t);
          d.appendChild(t);
        });
        gate.hidden = true;
        brand.hidden = false;
        doc.hidden = false;
        window.scrollTo(0,0);
      })
      .catch(function(){
        btn.disabled = false;
        btn.textContent = original;
        err.textContent = 'Parolă incorectă.';
        pwEl.value = '';
        pwEl.focus();
      });
  });
})();
</script>
